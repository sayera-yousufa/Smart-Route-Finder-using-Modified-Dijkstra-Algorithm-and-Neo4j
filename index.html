<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Path Finder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 30px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      font-size: 28px;
      color: #2c3e50;
      margin-bottom: 30px;
    }

    label {
      margin-top: 10px;
      font-weight: 600;
      display: block;
      color: #333;
    }

    select, button {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      background-color: #3498db;
      color: white;
      border: none;
      margin-top: 20px;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #2980b9;
    }

    #output {
      background: #ecf9f1;
      padding: 20px;
      border-radius: 10px;
      margin-top: 30px;
      white-space: pre-line;
      font-size: 16px;
      color: #2b7a4b;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .map-container {
      margin: 20px 0;
      height: 400px;
      border: 2px dashed #bbb;
      border-radius: 10px;
      background-color: #fefefe;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #aaa;
      font-style: italic;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🚶‍♀️ Smart Path Finder</h2>

    <div class="map-container" id="map">
        <iframe src="smart_path_map.html" width="100%" height="100%" frameborder="0" style="border:0; border-radius: 10px;"></iframe>
      </div>
      

    <label for="source">From:</label>
    <select id="source"></select>

    <label for="target">To:</label>
    <select id="target"></select>

    <label for="accessibility">Accessibility Required?</label>
    <select id="accessibility">
      <option value="true">Yes</option>
      <option value="false">No</option>
    </select>

    <label for="crowd">Crowd Preference:</label>
    <select id="crowd">
      <option value="min">Minimum</option>
      <option value="max">Maximum</option>
    </select>

    <button onclick="findPath()">Find Optimal Path</button>

    <div id="output"></div>
  </div>

  <script>
    // Load location names from backend
    fetch('/get_locations')
      .then(res => res.json())
      .then(data => {
        const sourceSelect = document.getElementById('source');
        const targetSelect = document.getElementById('target');
        data.locations.forEach(loc => {
          const option1 = new Option(loc, loc);
          const option2 = new Option(loc, loc);
          sourceSelect.add(option1);
          targetSelect.add(option2);
        });
      });

    // Call backend to get optimal path
    function findPath() {
      const source = document.getElementById('source').value;
      const target = document.getElementById('target').value;
      const accessibility = document.getElementById('accessibility').value;
      const crowd = document.getElementById('crowd').value;

      fetch('/find_path', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ source, target, accessibility, crowd })
      })
        .then(res => res.json())
        .then(data => {
          const output = document.getElementById('output');
          if (data.success) {
            output.innerText = `🔗 Path: ${data.path.join(' → ')}\n📏 Total Cost: ${data.total_cost.toFixed(2)}\n\n🧭 Details:\n${data.details}`;
          } else {
            output.innerText = "🚫 " + data.message;
          }
        });
    }
  </script>
</body>
</html>
